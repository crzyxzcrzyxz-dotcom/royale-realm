# ==========================================================
#  BATTLE ROYALE - Configuracao principal
# ==========================================================

automatic:
  enabled: true
  interval-seconds: 1800
  first-delay-seconds: 600
  required-online: 2

match:
  # duracao da fase de entrada (segundos)
  join-seconds: 45
  min-players: 2
  # limite de jogadores (alteravel)
  max-players: 100
  # SOLO, DUO, TRIO, SQUAD
  mode: SOLO
  announce-at: []
  buttons-at: []
  countdown-title-seconds: 5
  # false = o jogador continua onde estava ate o embarque
  teleport-on-join: false
  glide-timeout-seconds: 60
  max-duration-seconds: 1800
  end-delay-seconds: 10

teams:
  # equipas nao se atacam
  friendly-fire: false
  # cor + simbolo de cada equipa (usados no nome)
  styles:
    - {color: "&a", symbol: "✦"}
    - {color: "&b", symbol: "✿"}
    - {color: "&d", symbol: "❖"}
    - {color: "&e", symbol: "★"}
    - {color: "&6", symbol: "☘"}
    - {color: "&c", symbol: "✵"}
    - {color: "&9", symbol: "✪"}
    - {color: "&5", symbol: "❂"}
    - {color: "&2", symbol: "✷"}
    - {color: "&3", symbol: "✹"}

spectator:
  enabled: true
  # ao morrer o jogador vira espectador automaticamente
  auto: true
  # so volta ao SMP clicando no botao do chat
  force-button: true

return:
  # ORIGINAL = bloco onde estava | SPAWN = spawn/coordenadas abaixo
  mode: ORIGINAL
  spawn:
    world: ""
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

commands:
  whitelist: [br, battleroyale, brl, msg, tell, r, help]
  bypass-permission: battleroyale.bypass

kit:
  enabled: true
  items:
    - "IRON_PICKAXE:1"
    - "OAK_PLANKS:64"
    - "BREAD:8"

elytra:
  remove-on-land: true
  cancel-first-fall-damage: true
  jump-boost: 0.4

bus:
  # segundos em que o onibus fica PARADO enquanto todos embarcam.
  # ele so parte quando a contagem chega a zero.
  board-seconds: 5
  default-speed: 0.85
  default-height: 160
  # tamanho do onibus
  length: 17
  width: 7
  height-blocks: 4
  roof: true
  # visual
  block: LIGHT_BLUE_CONCRETE
  glass-block: LIGHT_BLUE_STAINED_GLASS
  trim-block: WHITE_CONCRETE
  balloon: true
  balloon-block: BLUE_WOOL
  balloon-radius: 5
  jump-on-sneak: true
  force-eject: true

zone:
  # DANO FIXO da tempestade (2.0 = 1 coracao)
  damage: 2.0
  bossbar: true
  actionbar: true
  particles: true
  particle: CLOUD
  grace-seconds: 10
  damage-only-after-landing: true
  # margem antes de considerar o jogador fora (evita dano dentro da zona)
  outside-tolerance: 3.0
  # a zona fecha totalmente (raio 0) no fim
  close-completely: true
  # zonas aleatorias no mapa (estilo Fortnite)
  random-zones: true
  # so escolhe centros onde existe terreno solido
  terrain-check: true
  terrain-tries: 40

death:
  # ao morrer, os itens ficam num bau no local da morte
  chest: true
  chest-glow: true

border:
  # TELEPORT ou ELIMINATE
  action: TELEPORT
  warn-distance: 20

loot:
  min-slots: 3
  max-slots: 7
  hot-zone-multiplier: 2.0
  hot-zone-radius: 25
  fill-on-startup: true
  chances:
    COMMON: 44.0
    UNCOMMON: 26.0
    RARE: 16.0
    EPIC: 9.0
    LEGENDARY: 4.0
    MYTHIC: 1.0

regeneration:
  enabled: true
  reset-on-end: true
  blocks-per-tick: 600
  clear-drops: true
  # remove tambem entidades criadas na partida (armor stands, projeteis, etc)
  clear-entities: true
  chest-scan-radius: 0
  chunks-per-tick: 12

effects:
  join: true
  leave: true
  bus-trail: true
  jump: true
  land: true
  elimination: true
  lightning-on-elimination: true
  victory-fireworks: true
  # quantidade de fogos ao vencer
  victory-firework-count: 40
  zone-ring: true
  landing-resistance-seconds: 3

sounds:
  announce: "ui.toast.challenge_complete"
  join: "entity.experience_orb.pickup"
  leave: "block.note_block.bass"
  countdown: "block.note_block.pling"
  bus-start: "entity.ender_dragon.flap"
  jump: "entity.bat.takeoff"
  land: "entity.player.big_fall"
  zone-shrink: "entity.wither.spawn"
  storm-damage: "entity.player.hurt"
  elimination: "entity.lightning_bolt.thunder"
  victory: "ui.toast.challenge_complete"
  grappler: "entity.fishing_bobber.throw"
  grappler-pull: "entity.enderman.teleport"
  heal: "entity.player.levelup"
  error: "block.note_block.bass"

storage:
  autosave-seconds: 60
