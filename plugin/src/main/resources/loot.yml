# ==========================================================
#  LOOT E RARIDADES
#  material: nome vanilla OU "SPECIAL:<id>"
#  Cada raridade tem itens REALMENTE diferentes + bonus automatico.
# ==========================================================
rarities:
  COMMON:
    display: "COMUM"
    color: "&7"
    stars: 1
  UNCOMMON:
    display: "INCOMUM"
    color: "&a"
    stars: 2
  RARE:
    display: "RARO"
    color: "&9"
    stars: 3
  EPIC:
    display: "EPICO"
    color: "&5"
    stars: 4
  LEGENDARY:
    display: "LENDARIO"
    color: "&6"
    stars: 5
  MYTHIC:
    display: "MITICO"
    color: "&c"
    stars: 6

# bonus automatico aplicado pela raridade (o que faz raridade valer a pena)
bonus:
  COMMON:    {weapon: 0, armor: 0, bow: 0, unbreaking: 0}
  UNCOMMON:  {weapon: 1, armor: 1, bow: 1, unbreaking: 1}
  RARE:      {weapon: 2, armor: 2, bow: 2, unbreaking: 2}
  EPIC:      {weapon: 3, armor: 3, bow: 3, unbreaking: 3}
  LEGENDARY: {weapon: 4, armor: 4, bow: 4, unbreaking: 3}
  MYTHIC:    {weapon: 5, armor: 4, bow: 5, unbreaking: 4}

